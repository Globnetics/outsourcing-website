name: "Secret & File Size Guard"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  secret-scanner:
    name: "Gitleaks Deep History Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository with full history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install Open-Source Gitleaks Binary"
        run: |
          VERSION="8.18.4"
          echo "Installing Gitleaks v${VERSION}..."
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: "Run Gitleaks Full PR History Scan"
        run: |
          git fetch origin ${{ github.base_ref }} --depth=100
          MERGE_BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          echo "Scanning PR commits from merge-base ($MERGE_BASE) to HEAD..."
          gitleaks detect --source=. --log-opts="$MERGE_BASE..HEAD" --verbose --redact

  file-and-size-guard:
    name: "Check File Extensions, Paths & History Blobs"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Scan for Restricted Extensions, Sensitive Paths & Large Blobs"
        run: |
          git fetch origin ${{ github.base_ref }} --depth=100
          MERGE_BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          echo "Scanning all commits in PR range: $MERGE_BASE..HEAD"

          MAX_BYTES=52428800 # 50 MB
          FORBIDDEN_EXTS="pem|key|p12|pfx|pkcs12|kdbx|jks|keystore|ovpn"
          FAILED=0

          # 1. Scan changed filenames in the PR branch
          CHANGED_FILES=$(git diff --name-only --diff-filter=d "$MERGE_BASE..HEAD")
          for FILE in $CHANGED_FILES; do
            # Check forbidden extensions
            EXT="${FILE##*.}"
            if [[ "$EXT" =~ ^($FORBIDDEN_EXTS)$ ]]; then
              echo "::error title=Blocked File Extension::File '$FILE' has a restricted extension (.$EXT). Private keys and certificates must never be committed."
              FAILED=1
            fi

            # Check sensitive file paths
            BASENAME=$(basename "$FILE")
            if [[ "$BASENAME" =~ ^\.env ]] || [[ "$FILE" =~ (secrets|credentials)/ ]] || [[ "$BASENAME" =~ ^id_(rsa|ed25519) ]]; then
              echo "::error title=Blocked Sensitive Path::File '$FILE' matches restricted credentials/secret path pattern."
              FAILED=1
            fi
          done

          # 2. Scan ALL blob objects introduced in this PR history (catches large binaries even if deleted in a later commit)
          while read -r BLOB_SHA BLOB_TYPE BLOB_SIZE BLOB_PATH; do
            if [ "$BLOB_TYPE" = "blob" ] && [ "$BLOB_SIZE" -gt "$MAX_BYTES" ]; then
              echo "::error title=Blob Exceeds 50MB Limit::Git object '$BLOB_PATH' ($BLOB_SHA) is $BLOB_SIZE bytes (limit is $MAX_BYTES bytes / 50MB). Large binaries permanently bloat Git history."
              FAILED=1
            fi
          done < <(git rev-list --objects "$MERGE_BASE..HEAD" | git cat-file --batch-check='%(objectname) %(objecttype) %(objectsize) %(rest)')

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "Push blocked due to policy violations above. Please remove the flagged files or secrets and push again."
            exit 1
          fi
          echo "All extension, path, and blob size checks passed."
